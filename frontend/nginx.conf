server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Berkas hasil build memuat hash di namanya: aman di-cache selamanya.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker harus selalu diambil dari server supaya versi baru terpasang.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # HTML dan aset lain. Setiap rute /app/* sudah berupa berkas HTML statis sendiri (lihat src/pages/app/[...ruta].astro).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html $uri.html =404;
  }
}
