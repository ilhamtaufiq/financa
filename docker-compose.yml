# Compose untuk Coolify (Docker Compose resource). Tidak ada mapping port ke host:
# Coolify yang meneruskan trafik domain ke service lewat proxy-nya sendiri.
# Nilai rahasia diisi di UI Coolify (lihat .env.example untuk daftar variabelnya).
#
# Uji lokal: pakai file override yang membuka port ke host.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#   web -> http://localhost:8080    api -> http://localhost:8000

name: financa

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: financa
      MARIADB_USER: financa
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?isi MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Karakter khusus di password harus di-percent-encode (mis. @ jadi %40).
      DATABASE_URL: mysql://financa:${MYSQL_PASSWORD}@db:3306/financa
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL:-http://localhost:8080/reset}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_DARI: ${SMTP_DARI:-noreply@financa.local}
      # Integrasi Gmail. Kosongkan semua untuk mematikan fitur ini.
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      GMAIL_ENC_KEY: ${GMAIL_ENC_KEY:-}
      GMAIL_FRONTEND_URL: ${GMAIL_FRONTEND_URL:-}
    volumes:
      - bukti:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/kesehatan"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        # Alamat API yang diakses browser (bukan alamat internal container).
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  analitik:
    build:
      context: ./analitik
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Idealnya user MySQL khusus dengan hak SELECT saja. Lihat analitik/README.md.
      ANALITIK_DATABASE_URL: mysql://financa:${MYSQL_PASSWORD}@db:3306/financa
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ANALITIK_CORS_ORIGIN: ${DASBOR_ORIGIN:-http://localhost:5174}
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/api/v1/analitik/kesehatan"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  dasbor:
    build:
      context: ./dasbor
      args:
        # Alamat yang diakses browser admin (domain publik), bukan alamat internal container.
        VITE_BACKEND_URL: ${DASBOR_BACKEND_URL:-http://localhost:8000}
        VITE_ANALITIK_URL: ${DASBOR_ANALITIK_URL:-http://localhost:8100}
    restart: unless-stopped
    depends_on:
      - analitik
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db:
  bukti:
